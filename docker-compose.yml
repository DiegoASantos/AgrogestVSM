services:
  db:
    image: postgis/postgis:18-3.6
    env_file:
      - apps/api/.env
    ports:
      - "172.16.0.8:5440:5432"
    volumes:
      - agrogest_produccion_data:/var/lib/postgresql
      - /var/www/idl/agrogest-20260921-produccion.dump:/backups/agrogest.dump:ro
      - ./docker/postgres/20-restore.sh:/docker-entrypoint-initdb.d/20-restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file:
      - apps/api/.env
    ports:
      - "5177:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: .
      target: admin-web
      args:
        NEXT_PUBLIC_API_URL: http://190.119.191.195:5177
        NEXT_PUBLIC_ENVIRONMENT_LABEL: ""
    ports:
      - "5176:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  agrogest_produccion_data:
