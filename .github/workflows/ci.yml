name: CI - AgroGest VSM

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @agrogest/api typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @agrogest/mobile typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint Mobile
        run: pnpm --filter @agrogest/mobile lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

  notify:
    name: Notificar resultado
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 3
    steps:
      - name: Determinar estado
        id: status
        run: |
          TC="${{ needs.typecheck.result }}"
          LI="${{ needs.lint.result }}"
          TE="${{ needs.test.result }}"

          emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⚪" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          echo "TC_RESULT=${TC^^}" >> $GITHUB_OUTPUT
          echo "LI_RESULT=${LI^^}" >> $GITHUB_OUTPUT
          echo "TE_RESULT=${TE^^}" >> $GITHUB_OUTPUT
          echo "TC_RESULT_RAW=$TC" >> $GITHUB_OUTPUT
          echo "LI_RESULT_RAW=$LI" >> $GITHUB_OUTPUT
          echo "TE_RESULT_RAW=$TE" >> $GITHUB_OUTPUT
          echo "TC_EMOJI=$(emoji "$TC")" >> $GITHUB_OUTPUT
          echo "LI_EMOJI=$(emoji "$LI")" >> $GITHUB_OUTPUT
          echo "TE_EMOJI=$(emoji "$TE")" >> $GITHUB_OUTPUT

          FAILED_JOBS=""
          [ "$TC" != "success" ] && FAILED_JOBS="${FAILED_JOBS} Typecheck"
          [ "$LI" != "success" ] && FAILED_JOBS="${FAILED_JOBS} Lint"
          [ "$TE" != "success" ] && FAILED_JOBS="${FAILED_JOBS} Tests"
          echo "FAILED_JOBS=${FAILED_JOBS# }" >> $GITHUB_OUTPUT

          if [ "$TC" = "success" ] && [ "$LI" = "success" ] && [ "$TE" = "success" ]; then
            echo "ESTADO=ÉXITO" >> $GITHUB_OUTPUT
            echo "EMOJI=✅" >> $GITHUB_OUTPUT
          else
            echo "ESTADO=FRACASO" >> $GITHUB_OUTPUT
            echo "EMOJI=❌" >> $GITHUB_OUTPUT
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TRIGGER=Pull Request" >> $GITHUB_OUTPUT
            echo "RAMA=PR #${{ github.event.pull_request.number }} (${{ github.head_ref }} → ${{ github.base_ref }})" >> $GITHUB_OUTPUT
            echo "AUTOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            echo "COMMIT_MSG=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "COMMITTER=${{ github.actor }}" >> $GITHUB_OUTPUT
          else
            echo "TRIGGER=Push" >> $GITHUB_OUTPUT
            echo "RAMA=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "AUTOR=${{ github.event.head_commit.author.name }}" >> $GITHUB_OUTPUT
            echo "COMMIT_MSG=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "COMMITTER=${{ github.event.head_commit.author.name }}" >> $GITHUB_OUTPUT
          fi

          echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

          if [ "$TC" = "success" ] && [ "$LI" = "success" ] && [ "$TE" = "success" ]; then
            echo "BORDER_COLOR=#28a745" >> $GITHUB_OUTPUT
          else
            echo "BORDER_COLOR=#cb2431" >> $GITHUB_OUTPUT
          fi

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram no configurado. Saltando notificación."
            exit 0
          fi

          TEXTO="<b>${{ steps.status.outputs.EMOJI }} CI AgroGest VSM — ${{ steps.status.outputs.ESTADO }}</b>"
          TEXTO="${TEXTO}%0A%0A<b>📌 Evento:</b> ${{ steps.status.outputs.TRIGGER }}"
          TEXTO="${TEXTO}%0A<b>🌿 Rama:</b> ${{ steps.status.outputs.RAMA }}"
          TEXTO="${TEXTO}%0A<b>👤 Autor:</b> ${{ steps.status.outputs.AUTOR }}"
          TEXTO="${TEXTO}%0A<b>🔖 Commit:</b> <code>${{ steps.status.outputs.SHA_SHORT }}</code>"
          TEXTO="${TEXTO}%0A<b>💬 Mensaje:</b> ${{ steps.status.outputs.COMMIT_MSG }}"
          TEXTO="${TEXTO}%0A%0A<b>📋 Resultados:</b>"
          TEXTO="${TEXTO}%0A${{ steps.status.outputs.TC_EMOJI }} Typecheck: <b>${{ steps.status.outputs.TC_RESULT }}</b>"
          TEXTO="${TEXTO}%0A${{ steps.status.outputs.LI_EMOJI }} Lint: <b>${{ steps.status.outputs.LI_RESULT }}</b>"
          TEXTO="${TEXTO}%0A${{ steps.status.outputs.TE_EMOJI }} Tests: <b>${{ steps.status.outputs.TE_RESULT }}</b>"

          if [ "${{ steps.status.outputs.ESTADO }}" = "FRACASO" ]; then
            TEXTO="${TEXTO}%0A%0A⚠️ Falló:${{ steps.status.outputs.FAILED_JOBS }}"
          fi

          TEXTO="${TEXTO}%0A%0A🔗 <a href='${{ steps.status.outputs.RUN_URL }}'>Ver detalles en GitHub Actions</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${TEXTO}"

      - name: Notificar Email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.EMOJI }} CI AgroGest VSM — ${{ steps.status.outputs.ESTADO }}"
          to: santosvillasecad@gmail.com
          from: AgroGest CI
          body: |
            ${{ steps.status.outputs.EMOJI }}  CI AgroGest VSM — ${{ steps.status.outputs.ESTADO }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
             Evento : ${{ steps.status.outputs.TRIGGER }}
             Rama   : ${{ steps.status.outputs.RAMA }}
             Autor  : ${{ steps.status.outputs.AUTOR }}
             Commit : ${{ steps.status.outputs.SHA_SHORT }}
             Mensaje: ${{ steps.status.outputs.COMMIT_MSG }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

             RESULTADOS POR JOB
             ${{ steps.status.outputs.TC_EMOJI }} Typecheck : ${{ steps.status.outputs.TC_RESULT }}
             ${{ steps.status.outputs.LI_EMOJI }} Lint      : ${{ steps.status.outputs.LI_RESULT }}
             ${{ steps.status.outputs.TE_EMOJI }} Tests     : ${{ steps.status.outputs.TE_RESULT }}

            Ver detalles: ${{ steps.status.outputs.RUN_URL }}
