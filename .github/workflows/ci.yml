name: CI - AgroGest VSM

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @agrogest/api typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @agrogest/mobile typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint Mobile
        run: pnpm --filter @agrogest/mobile lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

  notify:
    name: Notificar resultado
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 2
    steps:
      - name: Determinar estado
        id: status
        run: |
          if [ "${{ needs.typecheck.result }}" = "success" ] &&
             [ "${{ needs.lint.result }}" = "success" ] &&
             [ "${{ needs.test.result }}" = "success" ]; then
            echo "ESTADO=EXITO" >> $GITHUB_OUTPUT
            echo "EMOJI=✅" >> $GITHUB_OUTPUT
            echo "MENSAJE=Todos los checks pasaron correctamente." >> $GITHUB_OUTPUT
          else
            echo "ESTADO=FRACASO" >> $GITHUB_OUTPUT
            echo "EMOJI=❌" >> $GITHUB_OUTPUT

            DETALLES=""
            [ "${{ needs.typecheck.result }}" != "success" ] && DETALLES="$DETALLES\n• Typecheck falló"
            [ "${{ needs.lint.result }}" != "success" ] && DETALLES="$DETALLES\n• Lint falló"
            [ "${{ needs.test.result }}" != "success" ] && DETALLES="$DETALLES\n• Tests fallaron"
            echo "MENSAJE=Fallos detectados:$DETALLES" >> $GITHUB_OUTPUT
          fi

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram no configurado. Saltando notificacion."
            exit 0
          fi

          TEXTO="${{ steps.status.outputs.EMOJI }} ${{ steps.status.outputs.ESTADO }}"
          TEXTO="${TEXTO}%0ARepositorio: ${{ github.repository }}"
          TEXTO="${TEXTO}%0ARama: ${{ github.ref_name }}"
          TEXTO="${TEXTO}%0ACommit: ${{ github.event.head_commit.message }}"
          TEXTO="${TEXTO}%0AAutor: ${{ github.event.head_commit.author.name }}"
          TEXTO="${TEXTO}%0A${{ steps.status.outputs.MENSAJE }}"
          TEXTO="${TEXTO}%0AVer: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXTO}"

      - name: Notificar Email (éxito o fracaso)
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.EMOJI }} CI - AgroGest VSM - ${{ steps.status.outputs.ESTADO }}"
          to: santosvillasecad@gmail.com
          from: AgroGest CI
          body: |
            ${{ steps.status.outputs.EMOJI }} **${{ steps.status.outputs.ESTADO }}** en AgroGest VSM

            **Rama:** ${{ github.ref_name }}
            **Commit:** ${{ github.event.head_commit.message }}
            **Autor:** ${{ github.event.head_commit.author.name }}

            ${{ steps.status.outputs.MENSAJE }}

            🔗 Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
