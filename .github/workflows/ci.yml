name: CI - AgroGest VSM

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @agrogest/api typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @agrogest/mobile typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint Mobile
        run: pnpm --filter @agrogest/mobile lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

  notify:
    name: Notificar resultado
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 2
    steps:
      - name: Determinar estado
        id: status
        run: |
          if [ "${{ needs.typecheck.result }}" = "success" ] &&
             [ "${{ needs.lint.result }}" = "success" ] &&
             [ "${{ needs.test.result }}" = "success" ]; then
            echo "ESTADO=EXITO" >> $GITHUB_OUTPUT
            echo "EMOJI=✅" >> $GITHUB_OUTPUT
            echo "MENSAJE=Todos los checks pasaron correctamente." >> $GITHUB_OUTPUT
          else
            echo "ESTADO=FRACASO" >> $GITHUB_OUTPUT
            echo "EMOJI=❌" >> $GITHUB_OUTPUT

            DETALLES=""
            [ "${{ needs.typecheck.result }}" != "success" ] && DETALLES="$DETALLES\n• Typecheck falló"
            [ "${{ needs.lint.result }}" != "success" ] && DETALLES="$DETALLES\n• Lint falló"
            [ "${{ needs.test.result }}" != "success" ] && DETALLES="$DETALLES\n• Tests fallaron"
            echo "MENSAJE=Fallos detectados:$DETALLES" >> $GITHUB_OUTPUT
          fi

      - name: Notificar WhatsApp
        env:
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          if [ -z "$WHATSAPP_APIKEY" ]; then
            echo "WhatsApp no configurado. Saltando notificación."
            exit 0
          fi

          MENSAJE=$(cat << 'EOF'
          ${{ steps.status.outputs.EMOJI }} CI - ${{ steps.status.outputs.ESTADO }}
          Repositorio: ${{ github.repository }}
          Rama: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}
          Autor: ${{ github.event.head_commit.author.name }}
          ${{ steps.status.outputs.MENSAJE }}
          Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          curl -s -X POST "https://api.callmebot.com/whatsapp.php" \
            -d "phone=$WHATSAPP_PHONE" \
            -d "text=$(echo "$MENSAJE" | tr '\n' ' ' | head -c 800)" \
            -d "apikey=$WHATSAPP_APIKEY"

      - name: Notificar Email (éxito o fracaso)
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.EMOJI }} CI - AgroGest VSM - ${{ steps.status.outputs.ESTADO }}"
          to: santosvillasecad@gmail.com
          from: AgroGest CI
          body: |
            ${{ steps.status.outputs.EMOJI }} **${{ steps.status.outputs.ESTADO }}** en AgroGest VSM

            **Rama:** ${{ github.ref_name }}
            **Commit:** ${{ github.event.head_commit.message }}
            **Autor:** ${{ github.event.head_commit.author.name }}

            ${{ steps.status.outputs.MENSAJE }}

            🔗 Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
